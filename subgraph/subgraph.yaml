specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: base-sepolia
    source:
      address: "0x9B75f3f0aeAF6B5E61A4Cd8E4E1e8F968d28B923"
      abi: Factory
      startBlock: 40897810
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
      abis:
        - name: Factory
          file: ./abis/Factory.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed uint8,indexed address,address[],string[],uint256,uint256,bytes32)
          handler: handleMarketCreated
      file: ./src/factory.ts
  - kind: ethereum/contract
    name: Router
    network: base-sepolia
    source:
      address: "0x9bE33AdE92C489c0daa339989BD827eb6dD84a13"
      abi: Router
      startBlock: 40897833
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Trader
        - TraderMarketPosition
        - Market
      abis:
        - name: Router
          file: ./abis/Router.json
      eventHandlers:
        - event: RouterDeposited(indexed address,indexed address,indexed address,uint8,uint256,uint256)
          handler: handleRouterDeposited
        - event: RouterRedeemed(indexed address,indexed address,indexed address,uint8,uint256,uint256)
          handler: handleRouterRedeemed
        - event: RouterRedeemedAndRepaid(indexed address,indexed address,indexed address,uint8,uint256,uint256,address,uint256)
          handler: handleRouterRedeemedAndRepaid
      file: ./src/router.ts
