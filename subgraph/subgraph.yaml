specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: base-sepolia
    source:
      address: "0x43E92A90b47d1316Dd27709A8990806B4E19f074"
      abi: Factory
      startBlock: 42379440
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
      abis:
        - name: Factory
          file: ./abis/Factory.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed uint8,indexed address,address[],string[],uint256,uint256,bytes32,address)
          handler: handleMarketCreated
      file: ./src/factory.ts
  - kind: ethereum/contract
    name: Vault
    network: base-sepolia
    source:
      address: "0x00a31D4094e6d28F898885def5BAB655c0cd8D90"
      abi: Vault
      startBlock: 42379440
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Staker
        - RewardClaim
        - EpochFees
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: Staked(indexed address,uint256,uint256)
          handler: handleStaked
        - event: UnstakeInitiated(indexed address,uint256,uint256)
          handler: handleUnstakeInitiated
        - event: UnstakeCompleted(indexed address,uint256)
          handler: handleUnstakeCompleted
        - event: UnstakeCancelled(indexed address,uint256)
          handler: handleUnstakeCancelled
        - event: RewardsClaimed(indexed address,indexed address,uint256)
          handler: handleRewardsClaimed
        - event: FeesReceived(indexed address,uint256,uint256,uint256,uint256)
          handler: handleFeesReceived
      file: ./src/vault.ts
  - kind: ethereum/contract
    name: Router
    network: base-sepolia
    source:
      address: "0xF71A379666670Bb50Ce0060c66F74C6F6111Eb71"
      abi: Router
      startBlock: 42379440
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MarketTrade
        - Trader
        - TraderMarketPosition
      abis:
        - name: Router
          file: ./abis/Router.json
        - name: Market
          file: ./abis/Market.json
      eventHandlers:
        - event: RouterRedeemed(indexed address,indexed address,indexed address,uint8,uint256,uint256)
          handler: handleRouterRedeemed
        - event: RouterRedeemedAndRepaid(indexed address,indexed address,indexed address,uint8,uint256,uint256,address,uint256)
          handler: handleRouterRedeemedAndRepaid
      file: ./src/router.ts
templates:
  - kind: ethereum/contract
    name: Market
    network: base-sepolia
    source:
      abi: Market
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MarketTrade
        - Trader
        - TraderMarketPosition
      abis:
        - name: Market
          file: ./abis/Market.json
      eventHandlers:
        - event: Deposited(indexed address,indexed address,indexed uint8,uint256,uint256,uint256,uint256)
          handler: handleDeposited
        - event: TokensRedeemed(indexed address,indexed uint8,uint256,uint256)
          handler: handleTokensRedeemed
      file: ./src/market.ts
