specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: FpmmFactory
    network: unichain-sepolia
    source:
      address: "0x001240bD2569526d0044069612C3ccBE869e5C97"
      abi: FpmmFactory
      startBlock: 61998839
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
      abis:
        - name: FpmmFactory
          file: ./abis/FpmmFactory.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed uint8,indexed address,address[],string[],uint256,uint256,bytes32,address)
          handler: handleMarketCreated
        - event: PriceFeedUpdated(indexed bytes32,address)
          handler: handlePriceFeedUpdated
      file: ./src/fpmm-factory.ts
  - kind: ethereum/contract
    name: Vault
    network: unichain-sepolia
    source:
      address: "0x13Df5A0CEc379346D9a498a74a7580d6e2983b45"
      abi: Vault
      startBlock: 61998735
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Staker
        - RewardClaim
        - EpochFees
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: Staked(indexed address,uint256,uint256)
          handler: handleStaked
        - event: Withdrawn(indexed address,uint256)
          handler: handleWithdrawn
        - event: RewardsClaimed(indexed address,indexed address,uint256)
          handler: handleRewardsClaimed
        - event: FeesReceived(indexed address,uint256,uint256,uint256,uint256)
          handler: handleFeesReceived
      file: ./src/vault.ts
  - kind: ethereum/contract
    name: OrderBook
    network: unichain-sepolia
    source:
      address: "0xFd5109fA917203947E350218928e3e39f5936813"
      abi: OrderBook
      startBlock: 62263796
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LimitOrder
        - LimitOrderFill
      abis:
        - name: OrderBook
          file: ./abis/OrderBook.json
      eventHandlers:
        - event: OrderPlaced(indexed address,indexed address,indexed address,uint256,uint256,bytes32,bool)
          handler: handleOrderPlaced
        - event: OrderMatched(indexed address,indexed address,indexed address,address,uint256,uint256)
          handler: handleOrderMatched
        - event: OrderCancelled(indexed address,indexed address,indexed address,uint256,bytes32)
          handler: handleOrderCancelled
      file: ./src/orderbook.ts
templates:
  - kind: ethereum/contract
    name: FpmmMarket
    network: unichain-sepolia
    source:
      abi: FpmmMarket
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MarketTrade
        - Trader
        - TraderMarketPosition
      abis:
        - name: FpmmMarket
          file: ./abis/FpmmMarket.json
      eventHandlers:
        - event: FpmmBuy(indexed address,indexed uint8,uint256,uint256,uint256)
          handler: handleFpmmBuy
        - event: FpmmSell(indexed address,indexed uint8,uint256,uint256)
          handler: handleFpmmSell
        - event: TokensRedeemed(indexed address,indexed uint8,uint256,uint256)
          handler: handleTokensRedeemed
        - event: MarketInitialized(address[],string)
          handler: handleMarketInitialized
        - event: MarketSettled(uint256)
          handler: handleMarketSettled
        - event: TokenResolved(indexed uint8,indexed address)
          handler: handleTokenResolved
        - event: EventResolved(indexed uint8,indexed address,uint256)
          handler: handleEventResolved
      file: ./src/fpmm-market.ts
