specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: monad-testnet
    source:
      address: "0x97DB87Bb6C4d83813cbc1Ae5E97d83001aFe279f"
      abi: Factory
      startBlock: 37444065
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
      abis:
        - name: Factory
          file: ./abis/Factory.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed uint8,indexed address,address[],string[],uint256,uint256,bytes32,address)
          handler: handleMarketCreated
        - event: PriceFeedUpdated(indexed bytes32,address)
          handler: handlePriceFeedUpdated
      file: ./src/factory.ts
  - kind: ethereum/contract
    name: Vault
    network: monad-testnet
    source:
      address: "0x3870Fd628e43FbEE7f2a1a922ACa13b3f1B53329"
      abi: Vault
      startBlock: 37440162
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Staker
        - RewardClaim
        - EpochFees
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: Staked(indexed address,uint256,uint256)
          handler: handleStaked
        - event: Withdrawn(indexed address,uint256)
          handler: handleWithdrawn
        - event: RewardsClaimed(indexed address,indexed address,uint256)
          handler: handleRewardsClaimed
        - event: FeesReceived(indexed address,uint256,uint256,uint256,uint256)
          handler: handleFeesReceived
      file: ./src/vault.ts
templates:
  - kind: ethereum/contract
    name: Market
    network: monad-testnet
    source:
      abi: Market
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MarketTrade
        - Trader
        - TraderMarketPosition
      abis:
        - name: Market
          file: ./abis/Market.json
      eventHandlers:
        - event: Deposited(indexed address,indexed address,indexed uint8,uint256,uint256,uint256,uint256)
          handler: handleDeposited
        - event: TokensRedeemed(indexed address,indexed uint8,uint256,uint256)
          handler: handleTokensRedeemed
      file: ./src/market.ts
