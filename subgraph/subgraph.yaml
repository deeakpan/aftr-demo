specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: base-sepolia
    source:
      address: "0x4521Bb1CDb50Ba00DdF5f866dC86de21AE1Bc4A5"
      abi: Factory
      startBlock: 40950026
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
      abis:
        - name: Factory
          file: ./abis/Factory.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed uint8,indexed address,address[],string[],uint256,uint256,bytes32,address)
          handler: handleMarketCreated
      file: ./src/factory.ts
  - kind: ethereum/contract
    name: Router
    network: base-sepolia
    source:
      address: "0xb959325D396d9b88a1A9D68A986F7462E83d7D68"
      abi: Router
      startBlock: 40950038
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Trader
        - TraderMarketPosition
        - Market
      abis:
        - name: Router
          file: ./abis/Router.json
      eventHandlers:
        - event: RouterDeposited(indexed address,indexed address,indexed address,uint8,uint256,uint256)
          handler: handleRouterDeposited
        - event: RouterRedeemed(indexed address,indexed address,indexed address,uint8,uint256,uint256)
          handler: handleRouterRedeemed
        - event: RouterRedeemedAndRepaid(indexed address,indexed address,indexed address,uint8,uint256,uint256,address,uint256)
          handler: handleRouterRedeemedAndRepaid
      file: ./src/router.ts
  - kind: ethereum/contract
    name: Vault
    network: base-sepolia
    source:
      address: "0x1Fa3E56832F53a83b0702b82C6C44D0DdC7163B5"  # Replace with AFTRFeeVault address after deployment — run: npm run subgraph:update-config
      abi: Vault
      startBlock: 41284688  # Replace with vault deploy block after deployment
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Staker
        - RewardClaim
        - EpochFees
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: Staked(indexed address,uint256,uint256)
          handler: handleStaked
        - event: UnstakeInitiated(indexed address,uint256,uint256)
          handler: handleUnstakeInitiated
        - event: UnstakeCompleted(indexed address,uint256)
          handler: handleUnstakeCompleted
        - event: UnstakeCancelled(indexed address,uint256)
          handler: handleUnstakeCancelled
        - event: RewardsClaimed(indexed address,indexed address,uint256)
          handler: handleRewardsClaimed
        - event: FeesReceived(indexed address,uint256,uint256,uint256,uint256)
          handler: handleFeesReceived
      file: ./src/vault.ts
