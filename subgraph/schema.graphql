"""Registered factory price feed for an asset key (BTC, ETH, …)."""
type PriceFeed @entity(immutable: false) {
  id: ID!
  assetKey: Bytes!
  feed: String!
  updatedAt: BigInt!
}

"""One row per deployed market (from factory `MarketCreated`). kind: 0=PRICE, 1=EVENT, 2=NAD_TOKEN."""
type Market @entity(immutable: false) {
  id: ID!
  kind: Int!
  """parimutuel | fpmm"""
  mechanism: String!
  """0=OPEN, 1=AWAITING_UMA, 2=SETTLED, 3=CANCELLED"""
  state: Int!
  collateralToken: String!
  stakeEndTimestamp: BigInt!
  resolveAfterTimestamp: BigInt!
  metadataHash: String!
  metadataURI: String
  creator: String!
  createdAt: BigInt!
  createdAtBlock: BigInt!
  settledAt: BigInt
  positions: [TraderMarketPosition!]! @derivedFrom(field: "market")
  trades: [MarketTrade!]! @derivedFrom(field: "market")
}

"""One market Deposited or TokensRedeemed (time series for trade activity charts)."""
type MarketTrade @entity(immutable: true) {
  id: ID!
  market: Market!
  trader: Trader!
  timestamp: BigInt!
  blockNumber: BigInt!
  collateralAmount: BigInt!
  outcomeIndex: Int!
  """buy | sell | redeem"""
  kind: String!
}

"""Wallet-level aggregates for leaderboards (e.g. orderBy totalDeposited)."""
type Trader @entity(immutable: false) {
  id: ID!
  totalDeposited: BigInt!
  totalRedeemed: BigInt!
  positions: [TraderMarketPosition!]! @derivedFrom(field: "trader")
}

"""Per-trader per-market collateral in/out (same grain as your Supabase indexer)."""
type TraderMarketPosition @entity(immutable: false) {
  id: ID!
  market: Market!
  trader: Trader!
  collateralIn: BigInt!
  collateralOut: BigInt!
  sharesIn: BigInt!
  sharesOut: BigInt!
  lastTradeTimestamp: BigInt!
}

"""One row per staker — tracks their current staked balance and lifetime rewards."""
type Staker @entity(immutable: false) {
  id: ID!                        # staker address
  stakedBalance: BigInt!         # current sMondalore balance (active stake)
  pendingUnstake: BigInt!        # amount in initiateUnstake queue
  totalStaked: BigInt!           # lifetime Mondalore staked
  totalUnstaked: BigInt!         # lifetime Mondalore unstaked
  totalRewardsClaimed: BigInt!   # lifetime rewards claimed (all tokens combined in USD not tracked here)
  rewardsClaimed: [RewardClaim!]! @derivedFrom(field: "staker")
}

"""One record per claimRewards() call per token."""
type RewardClaim @entity(immutable: true) {
  id: ID!           # txHash-logIndex
  staker: Staker!
  token: String!    # reward token address (0x0 = ETH)
  amount: BigInt!
  timestamp: BigInt!
  epoch: BigInt!
}

"""Per-epoch per-token fee totals received by the vault."""
type EpochFees @entity(immutable: false) {
  id: ID!           # epoch-tokenAddress
  epoch: BigInt!
  token: String!
  totalFees: BigInt!
  stakerShare: BigInt!
  treasuryShare: BigInt!
}

"""Resting limit order on MondaloreOrderBook (emitted only for unfilled remainder)."""
type LimitOrder @entity(immutable: false) {
  id: ID!                 # orderId (bytes32 hex)
  """Set when the market was indexed via FpmmFactory; null for unknown/parimutuel markets."""
  market: Market
  marketAddress: String!
  token: String!          # outcome ERC20
  user: String!
  price: BigInt!          # collateral per 1e{tokenDec} outcome tokens
  amount: BigInt!         # tokens remaining at place (buy) or tokens escrowed (sell)
  isBuy: Boolean!
  """open | cancelled"""
  status: String!
  createdAt: BigInt!
  createdAtBlock: BigInt!
  cancelledAt: BigInt
  txHash: String!
}

"""One CLOB fill (OrderMatched). amount = outcome tokens transferred; match event has no orderId."""
type LimitOrderFill @entity(immutable: true) {
  id: ID!                 # txHash-logIndex
  market: Market
  marketAddress: String!
  token: String!
  maker: String!
  taker: String!
  price: BigInt!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: String!
}
